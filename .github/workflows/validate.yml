name: Validate OpenChat AI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend JavaScript syntax
        run: node --check server.js
      - name: Check browser JavaScript syntax
        run: |
          node -e 'const fs=require("fs"); const html=fs.readFileSync("index.html","utf8"); const start=html.lastIndexOf("<script>"); const end=html.lastIndexOf("</script>"); if(start<0||end<=start) throw new Error("Inline JavaScript not found"); new Function(html.slice(start+8,end)); console.log("Browser JavaScript syntax is valid.");'
