<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19"><title>Jubair App Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d19;color:#edf3ff;font:14px system-ui,-apple-system,sans-serif}.app{max-width:1200px;margin:auto;padding:18px;min-height:100vh;display:flex;flex-direction:column;gap:14px}header,.bar,.tabs,.devices{display:flex;align-items:center;gap:9px;flex-wrap:wrap}header{justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#3ddc84,#087bba);display:grid;place-items:center;font-size:24px;color:#073b2b}h1{font-size:17px;margin:0}.muted{color:#91a0b8;font-size:11px;margin-top:3px}.btn,.tab{border:1px solid #34445c;background:#111b2c;color:#edf3ff;padding:9px 12px;border-radius:10px;font-weight:650}.btn.primary{background:linear-gradient(110deg,#7c3aed,#087bba);border:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.95fr);gap:14px;flex:1;min-height:0}.panel{border:1px solid #28364a;border-radius:16px;background:#111927;overflow:hidden;display:flex;flex-direction:column;min-height:520px}.panelhead{padding:14px 16px;border-bottom:1px solid #28364a;display:flex;justify-content:space-between;align-items:center}.tabs{padding:10px 12px 0}.tab{border:0;background:transparent;color:#91a0b8}.tab.active{color:#fff;border-bottom:2px solid #a78bfa;border-radius:0}.editor{width:100%;flex:1;min-height:360px;resize:none;border:0;outline:0;padding:15px;background:#080f1b;color:#dbeafe;font:12px/1.65 ui-monospace,monospace;tab-size:2}.preview{flex:1;background:white;border:0;width:100%;min-height:420px}.devices{padding:10px 12px;border-bottom:1px solid #28364a}.status{font-size:11px;color:#91a0b8;margin-left:auto}@media(max-width:760px){.app{padding:12px}.layout{grid-template-columns:1fr}.panel{min-height:430px}.editor{min-height:300px}.preview{min-height:360px}}
</style></head><body><main class="app"><header><div class="brand"><div class="logo">♟</div><div><h1>Jubair App Preview</h1><div class="muted">Code • Run • Preview</div></div></div><div class="bar"><button class="btn" onclick="resetCode()">Reset</button><button class="btn" onclick="copyCode()">Copy code</button><button class="btn primary" onclick="render()">▶ Run preview</button></div></header>
<div class="layout"><section class="panel"><div class="panelhead"><b>Code editor</b><span class="muted">HTML / CSS / JavaScript</span></div><div class="tabs"><button class="tab active" data-kind="html">HTML</button><button class="tab" data-kind="css">CSS</button><button class="tab" data-kind="js">JavaScript</button></div><textarea id="editor" class="editor" spellcheck="false"></textarea><div class="panelhead"><span class="muted" id="count">Ready</span><span class="muted">Autosaves on this device</span></div></section>
<section class="panel"><div class="panelhead"><b>Live preview</b><span class="muted">Sandboxed</span></div><div class="devices"><button class="btn" onclick="sizePreview('100%')">Responsive</button><button class="btn" onclick="sizePreview('390px')">Mobile</button><button class="btn" onclick="sizePreview('768px')">Tablet</button><span class="status" id="status">Preview ready</span></div><iframe id="preview" class="preview" sandbox="allow-scripts"></iframe></section></div></main>
<script>
const defaults={html:'<main class="card"><h1>Hello, Jubair!</h1><p>Your app preview is ready.</p><button onclick="document.querySelector(\'p\').textContent=\'It works!\'">Try me</button></main>',css:'body{font-family:system-ui;background:#eef2ff;display:grid;place-items:center;min-height:95vh}.card{background:white;padding:32px;border-radius:20px;box-shadow:0 12px 40px #24345a22;text-align:center}h1{color:#4f46e5}button{background:#4f46e5;color:white;border:0;border-radius:9px;padding:10px 16px}',js:'console.log("Jubair App Preview is running");'};
let kind='html',code={...defaults};const editor=document.getElementById('editor'),frame=document.getElementById('preview');
function load(){try{code={...defaults,...JSON.parse(localStorage.getItem('jubair-code')||'{}')}}catch{}editor.value=code[kind];render()}
function save(){code[kind]=editor.value;try{localStorage.setItem('jubair-code',JSON.stringify(code))}catch{}document.getElementById('count').textContent=editor.value.length+' characters'}
function render(){save();const doc='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+code.css+'</style></head><body>'+code.html+'<script>'+code.js+'<\/script></body></html>';frame.srcdoc=doc;document.getElementById('status').textContent='Preview updated'}
function sizePreview(w){frame.style.maxWidth=w;frame.style.margin='0 auto'}
function copyCode(){save();const value='<!-- HTML -->\n'+code.html+'\n<style>\n'+code.css+'\n</style>\n<script>\n'+code.js+'\n<'+'/script>';if(window.Native)Native.copy(value);else navigator.clipboard?.writeText(value)}
function resetCode(){code={...defaults};editor.value=code[kind];render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{save();kind=b.dataset.kind;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));editor.value=code[kind]});
editor.addEventListener('input',()=>{save();clearTimeout(window.previewTimer);window.previewTimer=setTimeout(render,450)});
load();
</script></body></html>
